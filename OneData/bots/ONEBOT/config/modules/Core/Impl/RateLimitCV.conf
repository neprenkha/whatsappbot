# OneData/bots/ONEBOT/config/modules/Core/Impl/RateLimitCV.conf
# Purpose: RateLimit CV implementation config.

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Module toggle
enabled=1

# Logging toggles
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Allowed send windows (local time)
# Format: window.N=HH:MM-HH:MM
window.1=08:00-10:00
window.2=20:00-22:00

# If windows are set:
# 1 = block outside windows
# 0 = ignore windows (always allow)
enforceWindows=0

# Daily limits (weight-based; default weight=1 per message)
dailyMaxGlobal=500
dailyMaxPerChat=80

# Minimum gap between messages per chat
minGapMsPerChat=1500

# Burst control (simple sliding window)
burstWindowMs=60000
burstMaxGlobal=60
burstMaxPerChat=10

# Active chat block window in ms for auto sends only (0=off)
idleMs=180000

# State persistence
dataDirRel=RateLimit
stateFileName=state.json
persistDebounceMs=400

# Safety
maxChatEntries=5000

# Window bypass for selected chats/groups
windowBypassGroupChats=0
windowBypassChatIds=120363402608825006@g.us