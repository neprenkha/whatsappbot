# OneData/bots/ONEBOT/config/modules/Core/Impl/FallbackCV.conf
# Purpose: Fallback CV config (ASCII-only, key=value)

# Basic
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf
defaultGroupKey=ops

# Storage
ticketStoreSpec=jsonstore:Fallback/tickets
ticketSeqKey=Fallback/ticketSeq

# Ticket status
ticketStatusOpen=open
ticketStatusClosed=closed
ticketIdRegex=\b\d{4}T\d{7}\b

# Buffer and burst
msgBufferMax=20
burstMs=1200

# Forward formatting
forwardTextPrefixTemplate=Ticket {TICKETID} from {FROM} ({CHATID}) count={COUNT}
forwardTextMaxLen=3500
ticketCardTemplate=Ticket {TICKETID}\nCustomer: {CUSTOMER}\nName: {NAME}\nStatus: {STATUS}\nTime: {TIME}\nCount: {COUNT}\nLast: {LASTTEXT}\nReply 1: {QR1}\nReply 2: {QR2}\nReply 3: {QR3}

# Customer acknowledgement
inboundAckTemplate=Your message has been received.

# Phase B staff reply routing
cmdReply=!r
minRoleTicketReply=staff
replyNoAccess=You are not allowed to reply.
replyGroupOnly=Reply works in groups only.
replyNeedTicket=Ticket id is required.
replyNeedText=Reply text is required.
replyTicketNotFound=Ticket not found.
replyTicketClosed=Ticket is closed.
replyReplySent=Reply sent.

# Phase C staff reply media routing
replyMediaSendPrefer=send
replyMediaMaxTries=1
replyMediaRetryBaseMs=0
replyMediaRetryJitterMs=0
replyMediaGapMs=0
replyMediaDownloadTimeoutMs=1000
replyAudioAsVoice=0
replyVideoAsDocument=0

# Logging toggles
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Phase E bind and move routing
cmdBindTag=!bind
cmdMoveTicket=!move
bindMapStoreKey=Fallback/bindMap