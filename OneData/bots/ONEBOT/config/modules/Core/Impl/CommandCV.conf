# OneData/bots/ONEBOT/config/modules/Core/Impl/CommandCV.conf
# Purpose: Command registry and inbound command dispatcher.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# COMMAND ROUTING
prefix=!
allowInDm=1
allowInGroups=1
unknownText=Unknown command.
unknownControlGroupOnly=0
unknownPassthroughDm=1
unknownIgnoreNames=r,bind,move

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0