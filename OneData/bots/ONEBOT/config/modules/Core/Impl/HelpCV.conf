# OneData/bots/ONEBOT/config/modules/Core/Impl/HelpCV.conf
# Purpose: Help command module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Help command keys
cmdHelp=help
actionSearch=search
minRoleHelp=staff
helpCommandDescription=Show help topics.

# Help replies
replyConfigError=Help is temporarily unavailable.
replyNoCommands=No commands available.
replyTopicNotFound=Help topic not found.
replySearchNoMatch=No help topics match your search.

# Output templates
titleAllTemplate=Commands
titleTopicTemplate=Topic {TOPIC}
titleSearchTemplate=Search results for {KEYWORD}
lineTemplate={PREFIX}{CMD} - {HELP}