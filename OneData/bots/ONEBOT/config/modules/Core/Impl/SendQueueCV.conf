# OneData/bots/ONEBOT/config/modules/Core/Impl/SendQueueCV.conf
# Purpose: SendQueue CV implementation config.

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Module toggle
enabled=1

# Logging toggles
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Service bindings
serviceName=send
outboxService=outbox
transportService=transport

# Queue controls
delayMs=800
retryDelayMs=800
tickMs=800
maxQueue=2000
batchMax=30

# Dedupe controls
dedupeMs=6000
dedupeMax=8000
dedupeLog=1