# OneData/bots/ONEBOT/config/modules/Core/Impl/SendQueueCV.conf
# Purpose: SendQueue CV implementation config.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# SERVICE BINDING
serviceName=send
baseSend=outbox

# QUEUE CONTROLS
