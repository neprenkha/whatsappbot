# CONFIG: OneData/bots/ONEBOT/config/modules/Core/Impl/InboundDedupeCV.conf
# Purpose: Config-driven inbound event dedupe for duplicate message suppression.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# DEDUPE LIMITS
dedupeMs=6000
maxKeys=8000

# DEDUPE KEY RULES
keyMode=all
keyFields=chatId,senderId,fromMe,messageType,text,caption,filename,mimetype,rawId
skipWhenFromMe=1
skipWhenCommand=0
commandPrefixes=!,/,#
requireRawIdForDedupe=1

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0