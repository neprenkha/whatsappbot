# CONFIG: OneData/bots/ONEBOT/config/modules/Core/Impl/AccessRolesCV.conf
# Purpose: Role service and control-group role management commands.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# SERVICE WIRING
serviceName=access
commandService=command

# ROLE STORE
storeSpec=jsonstore:AccessRoles/assignments.json
storeKey=assignments
requiredRole=viewer
bootstrapFirstOwner=1
ownerSeedList=82828612100333@lid,lid:82828612100333

# ROLE ORDER
controllers=owner,admin,manager,sales,staff,viewer

# COMMAND KEYS
cmdRole=role
actionSet=set
actionDel=del
actionList=list
actionMe=me
cmdHelp=Manage role assignments.

# MESSAGE KEYS
msgNoAccess=No access.
msgUsage=Invalid role command.
msgBadRole=Invalid role value.
msgSetOk=Role updated.
msgDelOk=Role removed.
msgNotFound=User role not found.
msgMe=Your role: {role}. ID: {idKey}.
msgListPrefix=Roles: