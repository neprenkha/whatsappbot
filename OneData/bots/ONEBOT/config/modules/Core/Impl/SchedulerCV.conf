# OneData/bots/ONEBOT/config/modules/Core/Impl/SchedulerCV.conf
# Purpose: Scheduler command module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Store
storeNs=core
storeKey=Scheduler/jobs
storeSeqKey=Scheduler/seq

# Runtime
intervalMs=60000
jobIdPrefix=JOB

# Command and actions
cmdSchedule=schedule
actionCreate=create
actionList=list
actionPause=pause
actionResume=resume
actionCancel=cancel
cmdScheduleHelp=Manage scheduler jobs from group commands.

# Access
minRoleManage=manager

# Target types
targetTypeStaff=staff
targetTypeCustomer=customer
defaultTargetType=staff
defaultWorkgroupKey=finance
defaultDelayMinutes=60

# Policy
suppressionEventName=customer_active

# Replies
replyNoAccess=You are not allowed to run this command.
replyGroupOnly=This command works in groups only.
replyUsage=Usage: {PREFIX}{CMD} {CREATE} <workgroupKey> <delayMinutes> <targetType> <targetId> <message> | {PREFIX}{CMD} {LIST} | {PREFIX}{CMD} {PAUSE} <jobId> | {PREFIX}{CMD} {RESUME} <jobId> | {PREFIX}{CMD} {CANCEL} <jobId>
replyCreateNeedWorkgroup=Workgroup key is required.
replyCreateNeedMessage=Message is required.
replyCreateNeedDelay=Delay minutes is required.
replyCreateInvalidDelay=Delay minutes is invalid.
replyCreateNeedTarget=Target is required for customer target type.
replyWorkgroupNotFound=Workgroup not found.
replyCreateOk=Schedule job {JOBID} created for {WORKGROUP}.
replyListEmpty=No schedule jobs found.
replyListHeader=Schedule jobs:
replyListItemTemplate=- {JOBID} {STATUS} wg={WORKGROUP} target={TARGETTYPE}:{TARGETID} due={DUEAT}
replyJobNotFound=Schedule job not found.
replyPauseOk=Schedule job {JOBID} paused.
replyResumeOk=Schedule job {JOBID} resumed.
replyCancelOk=Schedule job {JOBID} cancelled.
replyUnknownAction=Unknown scheduler action.

# Outbound task template
staffTaskTemplate=Schedule task {JOBID}\nWorkgroup: {WORKGROUP}\nTarget: {TARGETTYPE}:{TARGETID}\nMessage: {MESSAGE}\nDue: {DUEAT}