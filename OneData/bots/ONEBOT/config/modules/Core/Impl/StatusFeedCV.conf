# OneData/bots/ONEBOT/config/modules/Core/Impl/StatusFeedCV.conf
# Purpose: StatusFeed command module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Command and actions
cmdStatusFeed=statusfeed
actionPost=post
actionPreview=preview
actionHelp=help
cmdStatusFeedHelp=Post status updates to workgroup feed.

# Access
minRoleStatusFeed=manager

# Argument indexes
argIndexWorkgroup=1
argIndexMessage=2

# Replies
replyNoAccess=You are not allowed to run this command.
replyGroupOnly=This command works in groups only.
replyUsage=Usage: {PREFIX}{CMD} {POST} <workgroupKey> <message> | {PREFIX}{CMD} {PREVIEW} <workgroupKey> <message> | {PREFIX}{CMD} {HELP}
replyNeedWorkgroup=Workgroup key is required.
replyNeedMessage=Message is required.
replyWorkgroupNotFound=Workgroup not found.
replyPostOk=Status feed posted to {WORKGROUP}.
replyPreviewTemplate=Preview {WORKGROUP} {TIME}\n{MESSAGE}

# Feed template
feedTemplate=StatusFeed {WORKGROUP}\nTime: {TIME}\nMessage: {MESSAGE}