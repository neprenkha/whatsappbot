# CONFIG: OneData/bots/ONEBOT/config/modules/Core/Impl/OutboundGatewayCV.conf
# Purpose: Outbound gateway policy and service publication.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# SERVICE WIRING
baseSend=transport
ratelimitService=ratelimit
exportServices=sendout,outsend

# RATE LIMIT LOG CONTROL
rateLimitLogDebounceMs=30000
bypassChatIds=

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0