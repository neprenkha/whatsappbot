# OutboundGatewayCV.conf (canonical keys)

enabled=1

# Logging toggles (standard)
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Base sender service (must support media objects)
baseSend=transport

# RateLimit service name
ratelimitService=ratelimit

# Exported gateway services
services=sendout,outsend

# RateLimit block log throttling
rateLimitLogDebounceMs=30000
rateLimitLogTrackerMaxSize=1000

# Allow bypass for internal control group (optional)
bypassChatIds=120363402608825006@g.us
