# OneData/bots/ONEBOT/config/modules/Core/Impl/LogCV.conf
# Purpose: Log CV implementation config.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# OUTPUT SWITCHES
fileEnabled=1
consoleEnabled=1
fileLevel=info
consoleLevel=info

# STORAGE
dir=
mode=daily

# PAYLOAD CONTROL
logEvents=1
logMessages=1
messagePreviewLen=200
metaMaxLen=600
asciiOnly=1
redactPhone=0
purgeDays=0
captureUnhandled=1

# SEND TAP
tapSendEnabled=0
tapSendServices=outsend,sendout,send
tapSendArgsMax=200
hookConsole=1