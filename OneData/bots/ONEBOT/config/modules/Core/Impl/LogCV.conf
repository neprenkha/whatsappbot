# LogCV.conf (canonical keys)

# Core switches
enabled=1
fileEnabled=1
consoleEnabled=1
fileLevel=info
consoleLevel=info
hookConsole=1

# Paths and rotation
# Note: absolute path is allowed for log output.
dir=X:\OneData\bots\ONEBOT\logs
mode=daily

# Timezone
timeZone=Asia/Kuala_Lumpur

# What to log
logEvents=1
logMessages=1

# Output details
messagePreviewLen=200
metaMaxLen=600
asciiOnly=1
redactPhone=0

# Optional
purgeDays=0
captureUnhandled=1

# Send tap (optional)
tapSendEnabled=0
tapSendServices=outsend,sendout,send
tapSendArgsMax=200
