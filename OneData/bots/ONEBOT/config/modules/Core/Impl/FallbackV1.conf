# OneBot Module: FallbackV1
# Purpose: Configure FallbackCV behavior
#
# RULES (HARD - MUST FOLLOW):
# - ASCII ONLY
# - APPEND ONLY (for future edits)
# - NO DUPLICATE KEYS
# - SETTINGS: key=value (no spaces)

############################################################
# CORE
############################################################
enabled=1

############################################################
# GROUPS
############################################################
controlGroupId=120363402608825006@g.us

############################################################
# TICKETS
############################################################
ticketType=fallback
ticketStoreSpec=jsonstore:Fallback/tickets.json
seqStart=1
ticketTemplateRel=ui/Fallback/ticketcard.txt

############################################################
# BUFFER
############################################################
burstMs=2500
msgBufferMax=20

############################################################
# SEND
############################################################
sendPrefer=outsend,sendout,transport
sendSpacingMs=800

############################################################
# MEDIA
############################################################
mediaTimeoutMs=120000
mediaRetryMs=900
mediaMaxAttempts=3

############################################################
# TEXT TEMPLATES
############################################################
mediaFailText=MediaSendFailed type={{ATTACH_TYPE}} name={{FILE_NAME}} reason={{REASON}}
missingTemplateText=

############################################################
# LOGGING
############################################################
moduleLog=1
bugLog=1
detailLog=0
traceLog=1
