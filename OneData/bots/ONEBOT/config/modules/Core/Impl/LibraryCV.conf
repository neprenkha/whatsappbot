# OneData/bots/ONEBOT/config/modules/Core/Impl/LibraryCV.conf
# Purpose: Library catalog module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging toggles
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Store
storeNs=core
storeKey=Library/catalog

# Roles
minRoleManage=manager
minRoleSearch=staff
minRoleSend=staff

# Commands
cmdLib=lib
actionAdd=add
actionSearch=search
actionShow=show
actionSend=send
actionDel=del
actionList=list

# Search
searchLimit=5
ticketIdRegex=\b\d{4}T\d{7}\b

# Replies
replyNoAccess=You are not allowed to run this action.
replyGroupOnly=This action works in groups only.
replyNeedArgs=Arguments are required.
replyNeedId=Item id is required.
replyNeedName=Item name is required.
replyNeedBody=Item body is required.
replySaved=Library item saved.
replyDeleted=Library item deleted.
replyNotFound=Library item or ticket not found.
replySearchEmpty=No library items matched.
replySearchHeader=Library search results:
replySearchLineTemplate=- {ID} {NAME} tags={TAGS} score={SCORE}
replyListHeader=Library items:
replyListLineTemplate=- {ID} {NAME} tags={TAGS}
replyShowTemplate=Id: {ID}\nName: {NAME}\nTags: {TAGS}\nBody: {BODY}
replyNeedTicket=Ticket id is required from quote or argument.
replyNeedFallback=Send requires Fallback service.
replySent=Library text sent.
replyUnknownAction=Unknown library action.

# Help
cmdLibHelp=Library catalog add/search/show/send/del/list.