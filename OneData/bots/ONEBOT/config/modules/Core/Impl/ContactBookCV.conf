# OneData/bots/ONEBOT/config/modules/Core/Impl/ContactBookCV.conf
# Purpose: ContactBook CV implementation config.

# CORE
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# STORE
storeNs=ContactBook
storeKey=state
ticketIdRegex=\b\d{4}T\d{7}\b
accountCodePrefix=ACC
picCodePrefix=PIC
contextCodePrefix=CTX
codeDigits=4

# COMMANDS
cmdAccount=acc
cmdPic=pic
cmdContext=ctx
actionNew=new
actionLink=link
actionShow=show
actionList=list

# ACCESS
minRoleManage=staff

# REPLIES
replyNoAccess=No access.
replyGroupOnly=This command works in control group only.
replyNeedAction=Action is required.
replyUnknownAction=Unknown action.
replyNeedAccount=Account code is required.
replyNeedContext=Context code is required.
replyNeedDisplayName=Display name is required.
replyNeedLabel=Context label is required.
replyNeedQuote=Quote a customer message first.
replyNeedTicket=Quote a ticket card first.
replyAccountCreated=Account created: {ACCOUNT_CODE}
replyAccountLinked=Account linked: {ACCOUNT_CODE}
replyAccountNotFound=Account not found.
replyAccountShow=Account {ACCOUNT_CODE} name={DISPLAY_NAME} type={ACCOUNT_TYPE} pics={PIC_COUNT} contexts={CONTEXT_COUNT}
replyAccountListHeader=Accounts:
replyAccountListItem={ACCOUNT_CODE} | name={DISPLAY_NAME} | type={ACCOUNT_TYPE}
replyPicLinked=PIC linked: {PIC_CODE} -> {ACCOUNT_CODE}
replyPicListHeader=PICS for {ACCOUNT_CODE}:
replyPicListItem={PIC_CODE} | name={DISPLAY_NAME} | phone={PHONE} | chatId={CHAT_ID}
replyContextCreated=Context created: {CONTEXT_CODE} -> {ACCOUNT_CODE}
replyContextLinked=Context linked: {CONTEXT_CODE}
replyContextListHeader=Contexts for {ACCOUNT_CODE}:
replyContextListItem={CONTEXT_CODE} | label={CONTEXT_LABEL}
replyListEmpty=No records found.

# LOGGING
moduleLog=1
bugLog=1
detailLog=0
traceLog=0