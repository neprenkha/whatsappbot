# OneData/bots/ONEBOT/config/modules/Core/Impl/ContactBookCV.conf
# Purpose: ContactBook CV implementation config.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# SERVICE WIRING
serviceName=contactbook
commandServiceName=command
jsonStoreServiceName=jsonstore
accessServiceName=access
workGroupsServiceName=workgroups

# ACCESS
minRoleManage=staff

# STORE
storeNs=core
storeKey=ContactBook/state
accPrefix=ACC
picPrefix=PIC
ctxPrefix=CTX
codePad=4
contextStatusOpen=open
contextStatusClosed=closed
assignedLabel=assigned
unassignedLabel=unassigned

# COMMAND KEYS
cmdAccount=acc
cmdPic=pic
cmdContext=ctx
actionNew=new
actionLink=link
actionShow=show
actionList=list
actionSetName=setname
actionClose=close

# REPLIES
replyNoAccess=No access.
replyGroupOnly=This command works in groups only.
replyControlGroupOnly=This command works in control group only.
replyUnknown=Unknown action.
replyNeedAccountName=Please provide account name.
replyNeedAccountCode=Please provide account code.
replyNeedPicId=Please provide PIC id.
replyNeedContextAccount=Please provide account code.
replyNeedContextLabel=Please provide context label.
replyNeedContextCode=Please provide context code.
replyNeedTicket=Please provide ticket id.
replyAccCreated=Account created {ACC} {NAME}.
replyPicLinked=PIC linked account={ACC} pic={PIC}.
replyContextCreated=Context created {CTX} account={ACC} label={LABEL}.
replyContextLinked=Context linked ticket={TICKET} context={CTX}.
replyAccountNotFound=Account not found.
replyPicNotFound=PIC not found.
replyContextNotFound=Context not found.
replyListEmpty=No records.
replyListHeader=Records:\n{ITEMS}
replyAccountItem=- {ACC} | {NAME} | {TYPE}
replyPicItem=- {PIC} | {ACC} | {NAME}
replyContextItem=- {CTX} | {ACC} | {LABEL} | {STATUS}
replyShowAccount=ACC={ACC} NAME={NAME} TYPE={TYPE}
replyShowPic=PIC={PIC} ACC={ACC} NAME={NAME}
replyShowContext=CTX={CTX} ACC={ACC} LABEL={LABEL} STATUS={STATUS}

# FILING HOOKS
folderAccountTemplate=Accounts/{ACC}
folderContextTemplate=Contexts/{CTX} - {LABEL}
folderInboxTemplate=Accounts/{ACC}/Inbox