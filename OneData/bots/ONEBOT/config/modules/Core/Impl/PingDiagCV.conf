# OneData/bots/ONEBOT/config/modules/Core/Impl/PingDiagCV.conf
# Purpose: PingDiag command module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Commands
cmdPing=ping
cmdDiag=diag

# Access control
minRolePing=staff
minRoleDiag=admin
replyNoAccess=You are not allowed to run this command.

# Command help text
cmdPingHelp=Ping health check.
cmdDiagHelp=Show diagnostic status.

# Reply templates
pingReplyTemplate=pong {TIME}
diagReplyTemplate=diag ok time={TIME} uptime={UPTIME} node={NODE} pid={PID}