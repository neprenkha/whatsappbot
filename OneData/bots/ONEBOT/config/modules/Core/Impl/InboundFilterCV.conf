# CONFIG: OneData/bots/ONEBOT/config/modules/Core/Impl/InboundFilterCV.conf
# Purpose: Config-driven inbound filtering for non-user noise.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# FILTER RULES
dropStatusBroadcast=1
statusBroadcastIds=status@broadcast
dropFromMe=0
dropEmptySystem=1
dropSystemTypes=protocol,e2e_notification,notification_template,notification,ciphertext
dropNotificationWhenEmpty=1
dropStatusWhenEmpty=1

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0