# OneData/bots/ONEBOT/config/modules/Core/Impl/OutboxCV.conf
# Purpose: Outbox CV implementation config.

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Module toggle
enabled=1

# Logging toggles
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Service binding
serviceName=outbox

# Queue state store
store=jsonstore:Outbox/state.json

# Processing controls
tickMs=2000
batchMax=5
maxAttempts=5
retryDelayMs=5000
deadMax=500