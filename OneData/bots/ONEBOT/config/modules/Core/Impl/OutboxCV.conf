# OneData/bots/ONEBOT/config/modules/Core/Impl/OutboxCV.conf
# Purpose: Outbox CV implementation config (JsonStore namespace mode).

# CORE
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# LOGGING
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# SERVICE
serviceName=outbox
sendPrefer=

# STORE
namespace=Outbox
storeKey=state

# LOOP
tickMs=2000
batchMax=5
maxAttempts=5
retryDelayMs=5000
deadMax=500