# CONFIG: OneData/bots/ONEBOT/config/modules/Core/Impl/OutboxCV.conf
# Purpose: Outbox queue and retry pump configuration.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# SERVICE WIRING
serviceName=outbox
storeServiceName=jsonstore
storeNamespace=core
storeKey=Outbox/state

# PUMP POLICY
pumpIntervalMs=2000
batchMax=5
sendPrefer=sendout,outsend

# RETRY POLICY
maxAttempts=8
retryBackoffMs=1000
retryBackoffMaxMs=60000

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0