# OutboxCV.conf (canonical keys)

enabled=1

# Logging toggles (standard)
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Canonical service name exposed by Outbox
serviceName=outbox

# Persistent store for queued items
store=jsonstore:Outbox/state.json

tickMs=2000
batchMax=5

# Sender preference (use OutboundGateway first)
sendPrefer=sendout,outsend,send
