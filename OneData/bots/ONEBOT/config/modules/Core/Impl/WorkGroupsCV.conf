# OneData/bots/ONEBOT/config/modules/Core/Impl/WorkGroupsCV.conf
# Purpose: WorkGroups command module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Command and actions
cmdWorkGroup=group
actionHelp=help
actionList=list
actionAdd=add
actionDel=del
cmdWorkGroupHelp=Manage work groups from control group.

# Access
minRoleWorkGroup=staff

# Store
storeNs=core
storeKey=WorkGroups/groups

# Replies and templates
replyNoAccess=You are not allowed to run this command.
replyGroupOnly=This command works in groups only.
replyControlGroupOnly=This command works in control group only.
replyUsageHelp=WorkGroups commands:
replyUsageList={PREFIX}{CMD} {ACTION}
replyUsageAdd={PREFIX}{CMD} {ACTION} <name> <chatId>
replyUsageDel={PREFIX}{CMD} {ACTION} <name>
replyListEmpty=No groups are currently saved.
replyListTemplate=Groups:\n{ITEMS}
replyListItemTemplate=- {NAME} = {CHATID}
replyAddNeedName=Please provide group name.
replyAddNeedChatId=Please provide chatId.
replyAddOk=Group {NAME} saved with chatId {CHATID}.
replyDelNeedName=Please provide group name.
replyDelNotFound=No group found with name {NAME}.
replyDelOk=Group {NAME} deleted.
replyUnknownAction=Unknown action.