# OneData/bots/ONEBOT/config/modules/Core/Impl/SystemControlCV.conf
# Purpose: SystemControl command module config (ASCII-only, key=value)

# Global reference
globalConfRel=modules/Core/Impl/GlobalCV.conf

# Logging
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# Service wiring
sendService=send

# Command names
cmdStatus=status
cmdRestart=restart
cmdInfo=info

# Command help text
cmdStatusHelp=Show runtime status.
cmdRestartHelp=Restart bot process.
cmdInfoHelp=Show runtime info.

# Access roles (allowed values: owner admin manager sales staff viewer)
minRoleStatus=manager
minRoleRestart=admin
minRoleInfo=staff

# Replies
replyNoAccess=You are not allowed to run this command.
replyControlGroupOnly=This command works in control group only.
replyGroupOnly=This command works in groups only.
replyRestarting=Restarting ONEBOT.
replyRestartUnavailable=Restart is unavailable due to invalid restart settings.
statusReplyTemplate=Bot: {BOT}\nTime: {TIME}\nUptime: {UPTIME}\nPid: {PID}\nNode: {NODE}
infoReplyTemplate=Bot: {BOT}\nTime: {TIME}\nUptime: {UPTIME}\nPid: {PID}\nNode: {NODE}\nPlatform: {PLATFORM}

# Restart behavior
restartExitCode=100