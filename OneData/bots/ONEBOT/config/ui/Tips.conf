# Tips/Helper Standard (Editable)
enabled=1

label=Tips:
bullet=•
maxItems=7
blankLine=1
appendOnce=1
skipIfContainsTips=1
showHelpText=1

# Per-command ordering (comma separated)
default=help,status,whoami,roles,ping,restart
help=status,whoami,roles,ping,restart
status=help,whoami,roles,ping,restart
whoami=add,del,roles,status,help
roles=whoami,status,help
ping=status,help
restart=status,help
add=roles,whoami,help,status
del=roles,whoami,help,status
setname=whoami,roles,help,status
unknown=help,status,whoami,roles
noaccess=whoami,roles,help,status

# Global tips (IMPORTANT):
tips=Try !help to see commands | Check bot health: !status | View your role: !whoami

# Optional override label for any command:
text.status=Show bot status & uptime
text.restart=Restart bot (admin only)
text.whoami=Copy the LID digits shown above for role management | Add role: !add staff {LID} | Remove role: !del staff {LID}
text.add=Add role (example: !add staff {LID})
text.del=Remove role (example: !del staff {LID})

# FALLBACK TIPS
label=Fallback Commands:
bullet=•
discardTips=Quote-reply this message OR use !r <ticket> <text>

label=Helpful Commands:
tips=!help | !r <ticket> | !add contact