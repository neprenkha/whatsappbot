# OneData/bots/ONEBOT/config/modules/Core/Impl/OutboxCV.conf
# Purpose: Outbox CV implementation config.

# CORE SWITCHES
enabled=1
globalConfRel=modules/Core/Impl/GlobalCV.conf

# MODULE LOGGING TOGGLES
moduleLog=1
bugLog=1
detailLog=0
traceLog=0

# SERVICE BINDING
serviceName=outbox
sendPrefer=

# JSON STORE
namespace=Outbox
storeKey=state

# PROCESSING CONTROLS
tickMs=2000
batchMax=5
maxAttempts=5
retryDelayMs=5000
deadMax=500